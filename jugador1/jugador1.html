<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Perfil jugador 1</title>
    <link href="jugador1.css" rel="stylesheet">
  </head>
  <body>
    <article>
      <header class="profile-header">
        <!-- Avatar del jugador -->
        <figure class="profile-avatar-container">
          <img loading="lazy" src="avatar.jpg" alt="Avatar de jugador" width="100px" height="100px" class="avatar">
        </figure>
        

        <!-- Información del jugador -->
        <div class="profile-info">
          <h1 class="profile-name">Jugador 1</h1>
          <strong class="profile-points">Puntos Totales: 10000</strong>
        </div>
        <!-- fin Informacion del jugador -->

      </header>
    </article>
  </body>
</html>
