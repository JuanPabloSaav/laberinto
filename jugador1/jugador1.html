<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link rel="stylesheet" href="../general.css">
    <link rel="stylesheet" href="inicio.css">
    <link rel="stylesheet" href="../tablaCalificacion.css">
    <link rel="stylesheet" href="jugador1.css">
</head>
<body>
    <header class="header-pagina">
        <nav>
            <a class="logo" href="../main.html">Desaf.io</a>
            <ul>
                <li> <a href="">Desafíos</a></li>
            </ul>
        </nav>
    </header>
    <div class="contenedor-dual">
        <div class="contenedor-izq">
            <section class="profile-data-container"> 
                <header class="profile-header">
                    <article class="profile-card">
                        <div class="profile-name-pfp-container">
                            <figure class="profile-picture">
                                <img src="../imagenes/imagen-perfil-3.png" alt="Foto de perfil del jugador 1">
                            </figure>
                            <h1 class="profile-name">Jugador 1</h1>
                        </div>

                        <div class="level-container">
                            <label for="nivel">Nivel 7</label>
                            <progress id="nivel" class="level-bar" value="70" max="100"></progress>
                            <div class="level-score">
                                <p class="level-value">6546</p>
                                <p class="level-value">9352</p>
                            </div>
                        </div>
                    </article> 
                </header>

                <!-- Estadísticas del jugador -->
                <section class="player-stats-container">
                    <div class="games-played-card">
                        <div class="stat-item">
                            <h2 class="stat-title">Laberinto 1</h2>
                            <p class="stat-value">165</p>
                        </div>
                        <div class="stat-item">
                            <h2 class="stat-title">Laberinto 2</h2>
                            <p class="stat-value">120</p>
                        </div>
                        <div class="stat-item">
                            <h2 class="stat-title">Laberinto 3</h2>
                            <p class="stat-value">45</p>
                        </div>
                        <div class="stat-item">
                            <h2 class="stat-title">Laberinto 4</h2>
                            <p class="stat-value">165</p>
                        </div>
                        <div class="stat-item">
                            <h2 class="stat-title">Laberinto 5</h2>
                            <p class="stat-value">120</p>
                        </div>
                        <div class="stat-item">
                            <h2 class="stat-title">Laberinto 6</h2>
                            <p class="stat-value">45</p>
                        </div>
                    </div>
                </section>
            </section> 
        </div>
        <div class="contenedor-der">
            <!--inicio tabla de clasificacion-->
            <div class="leaderboard-header">
                <h2 class="leaderboard-title">Tabla de Clasificación</h2> 
            </div>
            <ol class="leaderboard-list">
                <li>
                    <article class="leaderboard-player-card">  
                        <header class="leaderboard-player-header">
                            <!-- circulo de ranking-->
                            <div class="leaderboard-player-rank">1</div>

                            <!-- container de la informacion del jugador (avatar y nombre)-->
                            <a href="jugador1.html">
                                <span class="player-avatar-container">
                                    <img loading="lazy" src="../imagenes/imagen-perfil-3.png" alt="Avatar de jugador" width="40px" height="40px" class="avatar">
                                </span>
                                <strong class="leaderboard-player-name">Fede p</strong>
                            </a>
                        </header>
                        <!-- container de estadisticas (podria incluir tiempo tambien)-->
                        <div class="leaderboard-player-stadistics">
                            <strong>Puntos: 100</strong> 
                        </div>
                    </article>
                </li>
                <!--TODO: deberia repetirse con js-->
                <li>
                    <article class="leaderboard-player-card">  
                        <header class="leaderboard-player-header">
                            <!-- circulo de ranking-->
                            <div class="leaderboard-player-rank">2</div>

                            <!-- container de la informacion del jugador (avatar y nombre)-->
                            <a href="../jugador2/jugador2.html">

                                    <img loading="lazy" src="../imagenes/imagen-perfil-2.png" alt="Avatar de jugador" width="40px" height="40px" class="avatar">
                                </span>
                                <strong class="leaderboard-player-name">Juan</strong>
                            </a>
                        </header>
                        <!-- container de estadisticas (podria incluir tiempo tambien)-->
                        <div class="leaderboard-player-stadistics">

                        </div>
                    </article>
                </li>
                <li>
                    <article class="leaderboard-player-card">  
                        <header class="leaderboard-player-header">
                            <!-- circulo de ranking-->
                            <div class="leaderboard-player-rank">3</div>

                            <!-- container de la informacion del jugador (avatar y nombre)-->
                            <a href="../jugador3/jugador3.html">
                                <span class="player-avatar-container">
                                    <img loading="lazy" src="../imagenes/imagen-perfil-1.png" alt="Avatar de jugador" width="40px" height="40px" class="avatar">
                                </span>
                                <strong class="leaderboard-player-name">Valen</strong>

                        </header>
                        <!-- container de estadisticas (podria incluir tiempo tambien)-->

                            <strong>Puntos: 30</strong>
